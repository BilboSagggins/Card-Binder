<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCG Card Collector Binder</title>
<!-- Tailwind CSS for styling -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts for Typography -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          display: ['Cinzel', 'serif']
        }
      }
    }
  }
</script>
<style type="text/tailwindcss">
  .btn { @apply px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700/60 active:scale-95; }
  .btn-p { @apply px-4 py-2 rounded-xl text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 shadow transition active:scale-95; }
  .field { @apply bg-zinc-950 border border-zinc-700/80 rounded-xl px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500; }
  .panel { @apply bg-zinc-950 border border-zinc-800 rounded-xl; }
</style>
<style>
  /* Holo foil gradient effect for cards */
  .holo-card { position: relative; overflow: hidden; }
  .holo-card::before {
    content: "";
    position: absolute;
    top: -100%;
    left: -100%;
    width: 300%;
    height: 300%;
    background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.25) 40%, rgba(255, 0, 128, 0.2) 45%, rgba(0, 255, 255, 0.2) 50%, rgba(255, 255, 0, 0.2) 55%, transparent 80%);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 10;
  }
  .holo-card:hover::before { opacity: 1; }

  /* 3D Flip Styles */
  .persp { perspective: 1000px; }
  .t3d { transform-style: preserve-3d; }
  .bfh { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .ry180 { transform: rotateY(180deg); }

  /* Binder Rings Overlay */
  .ring {
    background: linear-gradient(90deg, #52525b, #d4d4d8 50%, #3f3f46);
    box-shadow: inset 0 1px 2px #000c, 2px 4px 6px #0008;
  }

  /* Page Turn Transition */
  @keyframes turn {
    0% { opacity: 0; transform: rotateY(-15deg) scale(.98); }
    100% { opacity: 1; transform: none; }
  }
  .animate-page-turn { animation: turn .35s ease forwards; transform-origin: left center; }
  .dragging { opacity: .4; }
  .drag-over { outline: 2px dashed #6366f1; outline-offset: -4px; }

  /* Grid Layout Presets */
  .grid-layout-2x2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 40rem; margin: 0 auto; }
  .grid-layout-3x3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 56rem; margin: 0 auto; }
  .grid-layout-4x3 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 68rem; margin: 0 auto; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased flex flex-col">

<!-- Main Top Header -->
<header class="bg-zinc-900/90 border-b border-zinc-800 sticky top-0 z-30 backdrop-blur-md px-4 py-3">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
    <div class="flex items-center gap-3 w-full md:w-auto justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center text-xl shadow-lg">📖</div>
        <div>
          <h1 class="font-display font-bold text-lg tracking-wide">TCG CARD BINDER</h1>
          <p class="text-xs text-zinc-400">Vault &amp; Portfolio Tracker</p>
        </div>
      </div>
      <!-- Mobile Value Display -->
      <div class="md:hidden panel px-3 py-1 text-right">
        <span class="text-[10px] text-zinc-400 uppercase block">Value</span>
        <span id="val-m" class="font-bold text-emerald-400 text-sm">$0.00</span>
      </div>
    </div>

    <!-- Header Actions & Controls -->
    <div class="flex items-center gap-3 flex-wrap justify-center">
      <div class="hidden md:flex flex-col panel px-4 py-1.5">
        <span class="text-[10px] text-zinc-400 uppercase font-semibold">Portfolio Value (Owned)</span>
        <span id="val" class="font-bold text-emerald-400 text-lg leading-tight">$0.00</span>
      </div>
      <div class="panel px-3 py-1.5 text-xs flex gap-3">
        <span><span class="text-zinc-400">Owned:</span> <b id="n-own" class="text-emerald-400">0</b></span>
        <span><span class="text-zinc-400">Needed:</span> <b id="n-need" class="text-rose-400">0</b></span>
      </div>
      <!-- Layout Switcher -->
      <div class="flex panel p-1">
        <button onclick="setLayout('2x2')" id="btn-2x2" class="px-2.5 py-1 text-xs font-semibold rounded-md">2x2</button>
        <button onclick="setLayout('3x3')" id="btn-3x3" class="px-2.5 py-1 text-xs font-semibold rounded-md">3x3</button>
        <button onclick="setLayout('4x3')" id="btn-4x3" class="px-2.5 py-1 text-xs font-semibold rounded-md">4x3</button>
      </div>
      <!-- Utility Buttons -->
      <div class="flex gap-2">
        <button onclick="exportData()" title="Export backup" class="btn">📥</button>
        <button onclick="exportNeededList()" title="Export Needed list with picture, prices & conditions" class="btn text-indigo-300 font-bold">📋 Export Needed</button>
        <label title="Import backup" class="btn cursor-pointer">📤<input type="file" accept=".json" onchange="importData(event)" class="hidden"></label>
        <button onclick="refreshPrices()" title="Refresh prices" class="btn">🔄</button>
        <button onclick="clearBinder()" title="Clear binder" class="btn text-rose-300">🗑️</button>
      </div>
    </div>
  </div>
</header>

<!-- Main Binder Content Container -->
<main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 flex flex-col items-center gap-6">
  <!-- Page Navigation Bar -->
  <div class="w-full max-w-4xl flex items-center justify-between bg-zinc-900/50 p-2 rounded-xl border border-zinc-800">
    <button onclick="go(-1)" id="prev" class="btn disabled:opacity-40">◀ Previous</button>
    <span class="text-xs text-zinc-400">Page <b id="pg" class="text-indigo-300">1</b> of <span id="pgs">1</span></span>
    <button onclick="go(1)" id="next" class="btn disabled:opacity-40">Next ▶</button>
  </div>

  <!-- Binder View Container -->
  <div class="relative bg-zinc-900 p-4 sm:p-8 rounded-2xl shadow-2xl border-4 border-zinc-800 max-w-6xl w-full">
    <!-- Binder Ring Binder Accents (Visible on desktop) -->
    <div class="hidden md:flex flex-col justify-around absolute -left-5 top-10 bottom-10 z-20 w-8 pointer-events-none">
      <div class="h-6 rounded-r-lg ring"></div>
      <div class="h-6 rounded-r-lg ring"></div>
      <div class="h-6 rounded-r-lg ring"></div>
      <div class="h-6 rounded-r-lg ring"></div>
      <div class="h-6 rounded-r-lg ring"></div>
    </div>
    <!-- Card Grid Area -->
    <div id="grid" class="w-full gap-3 sm:gap-4"></div>
  </div>

  <!-- Page Management Controls -->
  <div class="flex gap-3">
    <button onclick="addPage()" class="btn-p">➕ Add Page</button>
    <button onclick="delPage()" class="btn px-4 py-2">➖ Delete Page</button>
  </div>
</main>

<!-- CARD INSPECT MODAL -->
<div id="i-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-xl p-6 flex flex-col items-center gap-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
    <button onclick="closeInspect()" class="absolute top-4 right-4 text-zinc-400 hover:text-white font-bold px-2">✕</button>
    <h3 id="i-title" class="font-display font-bold text-lg text-center"></h3>
    <!-- 3D Interactive Card Flip Container -->
    <div class="persp w-64 cursor-pointer" style="aspect-ratio:2.5/3.5" onclick="$('flip').classList.toggle('ry180')">
      <div id="flip" class="relative w-full h-full transition-transform duration-700 t3d rounded-xl">
        <!-- Front Side -->
        <div class="absolute inset-0 rounded-xl overflow-hidden bfh border border-zinc-700/50 bg-zinc-950 holo-card">
          <img id="i-img" alt="" class="w-full h-full object-cover" onerror="imgErr(this)">
        </div>
        <!-- Back Side -->
        <div class="absolute inset-0 rounded-xl overflow-hidden bfh ry180 border border-zinc-700/50 bg-gradient-to-br from-indigo-900 to-zinc-900 flex items-center justify-center text-6xl">🎴</div>
      </div>
    </div>
    <p class="text-xs text-zinc-400">🔄 Tap the card to flip it</p>
    
    <!-- Status Control -->
    <div class="flex items-center justify-between w-full panel p-3">
      <span class="text-xs text-zinc-400">Status:</span>
      <div class="flex gap-2">
        <button onclick="inspStatus('owned')" id="i-owned" class="px-3 py-1.5 rounded-lg text-xs font-bold">✓ Owned</button>
        <button onclick="inspStatus('needed')" id="i-needed" class="px-3 py-1.5 rounded-lg text-xs font-bold">⏳ Needed</button>
      </div>
    </div>
    
    <!-- Card Info Details -->
    <div class="w-full panel p-4 text-xs space-y-2">
      <div class="flex justify-between border-b border-zinc-800 pb-1.5"><span class="text-zinc-400">Set:</span><b id="i-set"></b></div>
      <div class="flex justify-between border-b border-zinc-800 pb-1.5"><span class="text-zinc-400">Number:</span><b id="i-num"></b></div>
      <div class="flex justify-between border-b border-zinc-800 pb-1.5"><span class="text-zinc-400">Rarity:</span><b id="i-rar" class="text-indigo-400"></b></div>
      <div class="flex justify-between"><span class="text-zinc-400">TCGplayer Market:</span><b id="i-price" class="text-emerald-400 text-sm"></b></div>
      <a id="i-link" href="#" target="_blank" rel="noopener noreferrer" class="block text-center py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold transition mt-3">🔗 View on TCGplayer</a>
    </div>
    <button onclick="delInspect()" class="w-full py-2.5 bg-rose-950/60 hover:bg-rose-900 text-rose-300 rounded-xl text-xs font-semibold border border-rose-800/80">🗑️ Delete Card</button>
  </div>
</div>

<!-- Notification Toasts Container -->
<div id="toasts" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

<script>
/* Helper Utilities */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = p => Number.isFinite(parseFloat(p)) ? `$${parseFloat(p).toFixed(2)}` : 'N/A';
const API = 'https://api.tcgdex.net/v2/';
const ON = 'bg-indigo-600 text-white shadow', OFF = 'text-zinc-400 hover:text-white';

/* App State (Cleared) */
let S = { layout: '4x3', cur: 0, pages: [Array(12).fill(null)] };
let insp = { p: 0, s: 0 }, drag = null;
const priceEls = new Map();
const cap = () => ({ '2x2': 4, '3x3': 9, '4x3': 12 })[S.layout];

/* Network & API Logic */
async function fetchJSON(url, ms = 10000) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

const errText = e => !e ? 'unknown error' : e.name === 'AbortError' ? 'timed out' : e.name === 'TypeError' ? 'blocked or offline' : e.message;

async function withRetry(fn, tries = 2) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) { if (i >= tries - 1) throw e; await new Promise(r => setTimeout(r, 500)); }
  }
}

async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); }
  }));
  return out;
}

function pickPrice(prices) {
  if (!prices || typeof prices !== 'object') return null;
  const pos = v => typeof v === 'number' && v > 0;
  for (const k of ['holo', 'holofoil', 'normal', 'reverse', 'reverseHolofoil', ...Object.keys(prices)]) {
    const v = prices[k];
    if (v && typeof v === 'object') {
      const n = [v.marketPrice, v.market, v.midPrice, v.mid, v.lowPrice, v.low].find(pos);
      if (n != null) return n;
    }
  }
  return null;
}

const ptcgSet = id => id.replace(/^([a-z]+)0*(\d+)\.(\d+)(.*)$/i, '$1$2pt$3$4').replace(/^([a-z]+)0+(\d)/i, '$1$2');

function ptcgKey(setId, localId) {
  const num = String(localId ?? '');
  if (!setId || !num) return null;
  const gal = num.match(/^(GG|TG)\d+/i);
  let s = ptcgSet(setId);
  if (gal && !/(gg|tg)$/i.test(s)) s += gal[1].toLowerCase();
  return { s, n: num.replace(/^0+(?=\d)/, ''), gal: !!gal };
}

/* Image Utilities & Fallbacks */
function ph(name) {
  const t = esc((name || 'Card').slice(0, 24));
  return 'data:image/svg+xml;utf8,+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420"><rect x="3" y="3" width="294" height="414" rx="18" fill="#18181b" stroke="#3f3f46" stroke-width="6"/><text x="150" y="205" fill="#d4d4d8" font-family="sans-serif" font-size="20" text-anchor="middle">${t}</text><text x="150" y="235" fill="#71717a" font-family="sans-serif" font-size="14" text-anchor="middle">Image unavailable</text></svg>`)';
}

function imgErr(img) {
  if (img.src.startsWith('data:')) return;
  const alts = (img.dataset.alts || '').split('|').filter(u => u && u !== img.src), next = alts.shift();
  img.dataset.alts = alts.join('|');
  img.src = next || ph(img.alt);
}

const imgTag = (src, alts, name, cls) => `<img src="${esc(src)}" data-alts="${esc((alts || []).join('|'))}" alt="${esc(name)}" class="${cls}" onerror="imgErr(this)">`;

function cardLink(c) {
  if (c.url) return c.url;
  const s = (c.set || '').toLowerCase(), id = (c.id || '').toLowerCase();
  if (s.includes('galarian gallery') || id.includes('swsh12pt5gg') || id.includes('swsh12.5-gg'))
    return 'https://www.tcgplayer.com/search/pokemon/swsh-crown-zenith-galarian-gallery?productLineName=pokemon&page=1&view=grid&setName=swsh-crown-zenith-galarian-gallery';
  return c.url || `https://www.tcgplayer.com/search/pokemon/product?q=${encodeURIComponent(c.name + ' ' + (c.number || ''))}`;
}

/* Price Lookup Functions */
async function tcgdexLookup(card) {
  try {
    const d = await withRetry(() => fetchJSON(`${API}${card.lang || 'en'}/cards/${encodeURIComponent(card.id)}`, 8000));
    const tp = d.pricing && d.pricing.tcgplayer, price = pickPrice(tp);
    if (price == null) return null;
    const pid = Object.values(tp).find(v => v && typeof v === 'object' && v.productId)?.productId;
    return { price, url: pid ? `https://www.tcgplayer.com/product/${pid}` : null };
  } catch (e) { return null; }
}

async function ptcgLookup(card) {
  if ((card.lang || 'en') !== 'en') return null;
  let id = card.source === 'ptcg' ? card.id : null;
  if (!id) { const i = card.id.lastIndexOf('-'), k = ptcgKey(card.id.slice(0, i), card.id.slice(i + 1)); if (k) id = k.s + '-' + k.n; }
  if (!id) return null;
  try {
    const d = (await fetchJSON(`https://api.pokemontcg.io/v2/cards/${encodeURIComponent(id)}?select=id,tcgplayer`, 8000)).data;
    const price = pickPrice(d?.tcgplayer?.prices);
    return price == null ? null : { price, url: d.tcgplayer.url || null };
  } catch (e) { return null; }
}

const lookupPrice = async card => (card.source === 'ptcg' ? null : await tcgdexLookup(card)) || (await ptcgLookup(card));

async function refreshPrices() {
  const cards = S.pages.flat().filter(Boolean);
  if (!cards.length) return toast('No cards to refresh', 'error');
  toast(`Refreshing ${cards.length} price${cards.length > 1 ? 's' : ''}…`);
  let ok = 0;
  await pool(cards, 4, async c => { const r = await lookupPrice(c); if (r) { c.price = r.price; if (r.url) c.url = r.url; ok++; } });
  save(); render(); toast(`Updated ${ok} of ${cards.length} prices`, ok ? 'info' : 'error');
}

/* Binder Layout & Core Interactions */
function syncLayout() { ['2x2', '3x3', '4x3'].forEach(l => $('btn-' + l).className = `px-2.5 py-1 text-xs font-semibold rounded-md ${l === S.layout ? ON : OFF}`); }

function setLayout(l) {
  S.layout = l;
  S.pages = S.pages.map(p => { const n = [...p]; while (n.length < cap()) n.push(null); return n.slice(0, cap()); });
  save(); render(); toast('Switched to ' + l);
}

function render() {
  syncLayout();
  const g = $('grid'); g.className = `w-full gap-3 sm:gap-4 grid-layout-${S.layout} animate-page-turn`;
  S.pages[S.cur] ||= Array(cap()).fill(null);
  g.innerHTML = '';
  S.pages[S.cur].forEach((c, i) => {
    const el = document.createElement('div');
    const col = c ? (c.status === 'needed' ? 'border-rose-500/80 bg-rose-950/20' : 'border-emerald-500/80 bg-emerald-950/20') : 'border-zinc-800/80 hover:border-zinc-700';
    el.className = `relative aspect-[2.5/3.5] bg-zinc-950/80 rounded-xl border-2 ${col} flex items-center justify-center transition group overflow-hidden cursor-pointer`;
    el.draggable = !!c;
    el.ondragstart = e => { if (!c) return e.preventDefault(); drag = { p: S.cur, s: i }; e.target.classList.add('dragging'); };
    el.ondragover = e => { e.preventDefault(); el.classList.add('drag-over'); };
    el.ondragleave = () => el.classList.remove('drag-over');
    el.ondrop = e => {
      e.preventDefault(); el.classList.remove('drag-over'); if (!drag) return;
      const pg = S.pages[S.cur], tmp = pg[i]; pg[i] = S.pages[drag.p][drag.s]; S.pages[drag.p][drag.s] = tmp; drag = null; save(); render(); toast('Card moved');
    };
    el.onclick = e => { if (e.target.closest('.act')) return; if (c) { openInspect(S.cur, i); } };
    el.innerHTML = c ? `<div class="w-full h-full holo-card rounded-xl">${imgTag(c.image, c.alts, c.name, 'w-full h-full object-cover rounded-xl')}
        <span class="absolute top-2 right-2 z-10 ${c.status === 'needed' ? 'bg-rose-600/90' : 'bg-emerald-600/90'} text-white font-bold px-1.5 py-0.5 rounded text-[9px] uppercase">${esc(c.status)}</span>
        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-transparent to-black/20 opacity-0 group-hover:opacity-100 transition-opacity p-2 flex flex-col justify-between">
          <div class="flex justify-between"><div class="flex gap-1">
            <button onclick="toggleStatus(${S.cur},${i},event)" class="act btn !p-1.5">${c.status === 'needed' ? '⏳' : '✓'}</button>
            <button onclick="openInspect(${S.cur},${i})" class="act btn !p-1.5">🔍</button></div>
            <button onclick="removeCard(${S.cur},${i},event)" class="act btn !p-1.5">🗑️</button></div>
          <div class="bg-zinc-950/90 border border-zinc-800 p-1.5 rounded-lg"><p class="text-[11px] font-bold truncate">${esc(c.name)}</p>
            <div class="flex justify-between text-[10px] mt-0.5"><span class="text-zinc-400 truncate">${esc(c.number)}</span><b class="text-emerald-400">${fmt(c.price)}</b></div></div>
        </div></div>`
      : `<div class="flex flex-col items-center gap-1.5 text-zinc-600"><div class="w-8 h-8 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center font-bold text-xs">-</div><span class="text-[10px] uppercase font-semibold">Slot ${i + 1}</span></div>`;
    g.appendChild(el);
  });
  $('pg').textContent = S.cur + 1; $('pgs').textContent = S.pages.length;
  $('prev').disabled = S.cur === 0; $('next').disabled = S.cur === S.pages.length - 1;
  let total = 0, own = 0, need = 0;
  S.pages.forEach(p => p.forEach(c => { if (!c) return; if (c.status === 'needed') need++; else { own++; if (c.price) total += +c.price; } }));
  const v = '$' + total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  $('val').textContent = v; $('val-m').textContent = v; $('n-own').textContent = own; $('n-need').textContent = need;
}

function toggleStatus(p, s, e) { e.stopPropagation(); const c = S.pages[p][s]; c.status = c.status === 'needed' ? 'owned' : 'needed'; save(); render(); toast(`Marked ${c.name} as ${c.status}`); }
function removeCard(p, s, e) { e.stopPropagation(); S.pages[p][s] = null; save(); render(); toast('Card removed'); }
function go(d) { const n = S.cur + d; if (n >= 0 && n < S.pages.length) { S.cur = n; render(); } }
function addPage() { S.pages.push(Array(cap()).fill(null)); S.cur = S.pages.length - 1; save(); render(); toast('Added page'); }
function delPage() { if (S.pages.length <= 1) return toast('Cannot delete the only page', 'error'); S.pages.splice(S.cur, 1); S.cur = Math.min(S.cur, S.pages.length - 1); save(); render(); toast('Page deleted'); }
function clearBinder() { if (confirm('Clear the whole binder?')) { S = { layout: S.layout, cur: 0, pages: [Array(cap()).fill(null)] }; save(); render(); toast('Binder cleared'); } }

/* Inspector Controls */
function openInspect(p, s) {
  const c = S.pages[p][s]; if (!c) return; insp = { p, s };
  const im = $('i-img'); im.dataset.alts = (c.alts || []).join('|'); im.alt = c.name; im.src = c.image;
  $('i-title').textContent = c.name; $('i-set').textContent = c.set; $('i-num').textContent = c.number; $('i-rar').textContent = c.rarity;
  $('i-price').textContent = fmt(c.price); $('i-link').href = cardLink(c);$('i-owned').className = `px-3 py-1.5 rounded-lg text-xs font-bold ${c.status === 'owned' ? 'bg-emerald-600 text-white' : 'bg-zinc-800 text-zinc-400'}`;
  $('i-needed').className = `px-3 py-1.5 rounded-lg text-xs font-bold ${c.status === 'needed' ? 'bg-rose-600 text-white' : 'bg-zinc-800 text-zinc-400'}`;
  $('flip').classList.remove('ry180');$('i-modal').classList.remove('hidden');
}

const closeInspect = () => $('i-modal').classList.add('hidden');
function inspStatus(st) { const c = S.pages[insp.p][insp.s]; if (!c) return; c.status = st; save(); render(); openInspect(insp.p, insp.s); }
function delInspect() { S.pages[insp.p][insp.s] = null; save(); render(); closeInspect(); toast('Card removed'); }

/* LocalStorage Data & Import/Export */
const KEY = 'tcg_binder_data_v7';
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function exportData() {
  const a = document.createElement('a');
  a.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(S, null, 2));
  a.download = `TCG_Binder_${new Date().toISOString().slice(0, 10)}.json`; a.click(); toast('Exported binder');
}

function exportNeededList() {
  const neededCards = [];
  S.pages.forEach(p => p.forEach(c => {
    if (c && c.status === 'needed') neededCards.push(c);
  }));

  if (!neededCards.length) return toast('No Needed cards found to export', 'error');

  let textContent = `=========================================\n`;
  textContent += `       TCG BINDER - NEEDED CARDS LIST    \n`;
  textContent += `       Generated: ${new Date().toLocaleDateString()}       \n`;
  textContent += `=========================================\n\n`;

  neededCards.forEach((c, idx) => {
    const basePrice = parseFloat(c.price);
    const hasPrice = Number.isFinite(basePrice);

    const nm = hasPrice ? `$${basePrice.toFixed(2)}` : 'N/A';
    const lp = hasPrice ? `$${(basePrice * 0.85).toFixed(2)}` : 'N/A';
    const mp = hasPrice ? `$${(basePrice * 0.65).toFixed(2)}` : 'N/A';
    const hp = hasPrice ? `$${(basePrice * 0.45).toFixed(2)}` : 'N/A';
    const dmg = hasPrice ? `$${(basePrice * 0.30).toFixed(2)}` : 'N/A';

    textContent += `${idx + 1}. ${c.name}\n`;
    textContent += `   Set: ${c.set} | Number: ${c.number}\n`;
    textContent += `   Image: ${c.image || c.thumb || 'N/A'}\n`;
    textContent += `   TCGplayer Link: ${cardLink(c)}\n`;
    textContent += `   Prices by Condition:\n`;
    textContent += `     - Near Mint (NM): ${nm}\n`;
    textContent += `     - Lightly Played (LP): ${lp}\n`;
    textContent += `     - Moderately Played (MP): ${mp}\n`;
    textContent += `     - Heavily Played (HP): ${hp}\n`;
    textContent += `     - Damaged (DMG): ${dmg}\n`;
    textContent += `-----------------------------------------\n`;
  });

  const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Needed_Cards_Conditions_${new Date().toISOString().slice(0, 10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Exported ${neededCards.length} Needed card(s) with condition prices`);
}

function importData(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result); if (!Array.isArray(d.pages)) throw 0;
      S = { layout: d.layout || '4x3', cur: 0, pages: d.pages }; save(); render(); toast('Imported binder');
    } catch (err) { toast('Invalid backup file', 'error'); }
  };
  r.readAsText(f);
}

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `${type === 'error' ? 'bg-rose-900/90 border-rose-700' : 'bg-zinc-900/90 border-indigo-500/60'} text-xs px-4 py-2.5 rounded-xl border shadow-xl transition-all duration-300`;
  t.textContent = msg; $('toasts').appendChild(t); setTimeout(() => t.remove(), 3000);
}

/* Application Initialization (Cleared Storage) */
window.addEventListener('DOMContentLoaded', () => {
  try {
    localStorage.removeItem(KEY);
  } catch(e) {}
  S = { layout: '4x3', cur: 0, pages: [Array(12).fill(null)] };
  syncLayout();
  render();
});
</script>
</body>
</html>
