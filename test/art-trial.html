<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Search Trial</title>
<style>
:root{--bg:#09090b;--card:#18181b;--line:#27272a;--text:#f4f4f5;--mute:#a1a1aa;--acc:#14b8a6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:500 14px/1.4 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(9,9,11,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px}
h1{margin:0;font:800 1.05rem/1.2 Inter,system-ui,sans-serif}p.sub{margin:.2rem 0 .6rem;color:var(--mute);font-size:.75rem}
input{width:100%;background:#000;border:1px solid #3f3f46;border-radius:10px;padding:.65rem .8rem;color:var(--text);font:600 16px Inter,system-ui,sans-serif}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.6rem;max-height:7.4rem;overflow:auto}
.tags button{appearance:none;border:1px solid #3f3f46;background:var(--card);color:#d4d4d8;border-radius:999px;padding:.35rem .6rem;font:700 .7rem/1 Inter,system-ui,sans-serif}
.tags button i{font-style:normal;opacity:.6;margin-left:.25rem}.tags button.on{background:var(--acc);border-color:#5eead4;color:#042f2e}
main{padding:12px 16px 40px}.info{color:var(--mute);font-size:.78rem;margin:0 0 .7rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.45rem;display:flex;flex-direction:column;gap:.3rem}
.c img{width:100%;aspect-ratio:2.5/3.5;object-fit:cover;border-radius:6px;background:#000}
.c b{font-size:.75rem;line-height:1.2}.c span{color:var(--mute);font-size:.62rem}
.c .t{display:flex;flex-wrap:wrap;gap:.2rem}.c .t em{font-style:normal;font-size:.58rem;font-weight:700;background:#042f2e;color:#99f6e4;border-radius:999px;padding:.12rem .4rem}
.c .t em.hit{background:var(--acc);color:#042f2e}
</style></head><body>
<header><h1>🎨 Art search · trial</h1><p class="sub">580 random English Pokémon cards, tagged by a free AI model that looks at the artwork. Type what you remember from the art, or tap a tag.</p>
<input id="q" type="search" placeholder="e.g. moon, beach, snow, food, cake" autocomplete="off"><div class="tags" id="tags"></div></header>
<main><p class="info" id="info">Loading…</p><div class="grid" id="grid"></div></main>
<script>
let D=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('art-trial.json').then(r=>r.json()).then(d=>{D=d;tagsCloud();run()});
function counts(){const n=new Array(D.vocab.length).fill(0);Object.values(D.cards).forEach(c=>c[4].forEach(([j])=>n[j]++));return n}
function tagsCloud(){const n=counts();document.getElementById('tags').innerHTML=D.vocab.map((v,j)=>[v,j,n[j]]).filter(x=>x[2]).sort((a,b)=>b[2]-a[2]).map(([v,j,k])=>`<button data-v="${esc(v)}">${esc(v)}<i>${k}</i></button>`).join('');}
document.getElementById('tags').onclick=e=>{const b=e.target.closest('button');if(!b)return;const q=document.getElementById('q');q.value=q.value===b.dataset.v?'':b.dataset.v;run()};
document.getElementById('q').oninput=run;
function run(){
  if(!D)return;const q=document.getElementById('q').value.trim().toLowerCase();
  document.querySelectorAll('.tags button').forEach(b=>b.classList.toggle('on',b.dataset.v===q));
  // "moon" also finds "full moon" and "crescent moon"
  const want=q?new Set(D.vocab.map((v,j)=>[v,j]).filter(([v])=>v===q||v.split(' ').includes(q)||(q.length>3&&v.includes(q))).map(x=>x[1])):null;
  let list=Object.entries(D.cards);
  if(want){list=list.filter(([,c])=>c[4].some(([j])=>want.has(j))).sort((a,b)=>Math.max(...b[1][4].filter(([j])=>want.has(j)).map(x=>x[1]))-Math.max(...a[1][4].filter(([j])=>want.has(j)).map(x=>x[1])))}
  else list=list.filter(([,c])=>c[4].length).slice(0,60);
  document.getElementById('info').textContent=want?(want.size?`${list.length} card${list.length===1?'':'s'} with “${q}” in the art`:`“${q}” isn't one of the art words yet`):'A few tagged cards. Search above, or tap a tag.';
  document.getElementById('grid').innerHTML=list.slice(0,120).map(([pid,c])=>`<div class="c"><img loading="lazy" src="https://tcgplayer-cdn.tcgplayer.com/product/${pid}_200w.jpg" alt=""><b>${esc(c[0])}</b><span>${esc(c[1])} · ${esc(c[2])}</span><div class="t">${c[4].map(([j,z])=>`<em class="${want&&want.has(j)?'hit':''}">${esc(D.vocab[j])}</em>`).join('')}</div></div>`).join('');
}
</script></body></html>
