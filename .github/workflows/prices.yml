name: Update TCGplayer prices

# Copies TCGplayer market prices (via TCGCSV) into prices/*.json once a day, so the
# binder app can price any card by its TCGplayer product number.
on:
  schedule:
    - cron: "40 20 * * *"   # daily, shortly after TCGCSV's ~20:00 UTC refresh
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/build-prices.py
      - .github/workflows/prices.yml

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build price lists
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python3 scripts/build-prices.py
      - name: Save them to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices
          if git diff --cached --quiet; then echo "No price changes"; exit 0; fi
          git commit -m "Update TCGplayer prices"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
