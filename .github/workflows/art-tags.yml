name: Tag card art

# Looks at each English Pokémon card picture once with a free open-source AI model (CLIP) and saves what's in the
# art (moon, beach, snow…) to prices/art-tags.json for the app's "In the art" search. Each run only does cards that
# aren't tagged yet (newest first), so the first full scan is spread over a few runs and later runs just add new cards.
on:
  schedule:
    - cron: "23 */2 * * *"    # every 2 hours; quick once everything is tagged
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-art-tags.py
      - .github/workflows/art-tags.yml

permissions:
  contents: write

concurrency:
  group: art-tags
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Keep the AI model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-large-patch14-v1
      - name: Install the model's tools (CPU only)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.40,<5" pillow
      - name: Tag up to 2,400 new cards (about 2.3 seconds each)
        run: python3 scripts/build-art-tags.py --limit 2400
      - name: Save the tags to the site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices/art-tags.json
          if git diff --cached --quiet; then echo "No new tags"; exit 0; fi
          git commit -m "Update card art tags"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
