name: CardTrader check (one-time)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/cardtrader-probe.py, .github/workflows/cardtrader-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: What Chinese Pokémon cards does CardTrader have?
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: python3 scripts/cardtrader-probe.py 2>&1 | tee /tmp/report.txt
      - name: Save the report to the cardtrader-report branch
        run: |
          cd /tmp && mkdir r && cd r && git init -q -b cardtrader-report
          cp /tmp/report.txt .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.txt && git commit -q -m "CardTrader check report"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cardtrader-report
