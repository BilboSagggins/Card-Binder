name: news probe
on:
  push:
    branches: [news-probe]
    paths: [urls.txt, probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-report.txt && git commit -m "probe report" && git push
