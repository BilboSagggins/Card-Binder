name: news probe
on:
  push:
    branches: [news-probe]
    paths: [phtest/run.py, phtest/index.html, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet playwright && python3 -m playwright install --with-deps chromium > /dev/null
      - run: python3 phtest/run.py > probe-report.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-report.txt
          git add phtest/review-*.png 2>/dev/null || true
          git commit -m "probe report"
          git pull --rebase origin news-probe && git push
