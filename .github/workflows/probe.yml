name: news probe
on:
  push:
    branches: [news-probe]
    paths: [scripts/photo-probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: clip-vit-large-patch14-v1 }
      - run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu && pip install --quiet "transformers>=4.40,<5" pillow
      - run: python3 scripts/photo-probe.py > probe-report.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-report.txt
          [ -f photo-result.json ] && git add photo-result.json photo-sheet.jpg
          git commit -m "probe report"
          git pull --rebase origin news-probe && git push
