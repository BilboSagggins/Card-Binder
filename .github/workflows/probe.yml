name: news probe
on:
  push:
    branches: [news-probe]
    paths: [scripts/build-art-tags.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu && pip install --quiet "transformers>=4.40,<5" pillow sentencepiece protobuf
      - run: (python3 scripts/build-art-tags.py --limit 40 --out art-copy.json && python3 scripts/build-art-tags.py --limit 40 --out art-copy.json && python3 -c "import json;d=json.load(open('art-copy.json'));print('RESULT',d['model'],d['done'],d['tagged'],d['total'],len(d['t']),len(d['old_ids']),len(d['miss']),sum(1 for p in d['t'] if p not in set(d['old_ids'])))") > probe-report.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-report.txt
          if [ -f art-tags-trial.json ]; then git add art-tags-trial.json; fi
          git add art-copy.json
          git commit -m "probe report"
          git pull --rebase origin news-probe && git push
