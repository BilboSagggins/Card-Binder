name: news probe
on:
  push:
    branches: [news-probe]
    paths: [scripts/img-probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/img-probe.py > probe-report.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-report.txt
          git commit -m "probe report"
          git pull --rebase origin news-probe && git push
