<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Piece Data Check</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b; color: #f4f4f5; font: 16px/1.5 system-ui, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
  .big { font-size: 2.2rem; font-weight: 800; margin: .3em 0; }
  .ok { color: #34d399; } .bad { color: #fb7185; } .wait { color: #a1a1aa; }
  img { width: 160px; border-radius: 8px; margin-top: 12px; }
  p { color: #a1a1aa; max-width: 22rem; }
</style>
</head>
<body>
<main>
  <div>One Piece card data check</div>
  <div id="r" class="big wait">Checking…</div>
  <p id="d"></p>
  <div id="img"></div>
</main>
<script>
(async () => {
  const r = document.getElementById('r'), d = document.getElementById('d');
  try {
    const res = await fetch('https://optcgapi.com/api/sets/card/OP01-001/');
    const j = await res.json();
    const c = Array.isArray(j) ? j[0] : j;
    r.textContent = 'WORKS'; r.className = 'big ok';
    d.textContent = (c && c.card_name ? c.card_name + ' · $' + c.market_price : 'Got data back.') + ' Tell Claude: works.';
    if (c && c.card_image) document.getElementById('img').innerHTML = '<img alt="" src="' + c.card_image + '">';
  } catch (e) {
    r.textContent = 'BLOCKED'; r.className = 'big bad';
    d.textContent = 'The One Piece database refused the request (' + (e.message || e) + '). Tell Claude: blocked.';
  }
})();
</script>
</body>
</html>
